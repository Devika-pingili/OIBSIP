<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" role="img" aria-label="Coffee and travel illustration">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F8F3E7"/>
      <stop offset="100%" style="stop-color:#C89F65;stop-opacity:0.3"/>
    </linearGradient>
  </defs>
  <rect width="520" height="420" fill="url(#bg)" rx="12"/>
  <!-- Map background -->
  <ellipse cx="260" cy="210" rx="180" ry="140" fill="#6F4E37" opacity="0.08"/>
  <!-- Coffee cup -->
  <rect x="180" y="140" width="160" height="120" rx="8" fill="#FFFDF9" stroke="#6F4E37" stroke-width="3"/>
  <path d="M340 170 Q380 170 380 210 Q380 250 340 250" fill="none" stroke="#6F4E37" stroke-width="3"/>
  <ellipse cx="260" cy="140" rx="80" ry="12" fill="#3E2723"/>
  <!-- Steam -->
  <path d="M230 110 Q220 80 235 60" fill="none" stroke="#C89F65" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M260 100 Q250 65 265 45" fill="none" stroke="#C89F65" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M290 110 Q300 80 285 60" fill="none" stroke="#C89F65" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <!-- Compass -->
  <circle cx="400" cy="100" r="40" fill="#FFFDF9" stroke="#6F4E37" stroke-width="2"/>
  <polygon points="400,70 410,110 400,100 390,110" fill="#C89F65"/>
  <polygon points="400,130 410,90 400,100 390,90" fill="#6F4E37"/>
  <!-- Suitcase -->
  <rect x="80" y="280" width="100" height="70" rx="6" fill="#6F4E37"/>
  <rect x="80" y="270" width="100" height="15" rx="4" fill="#3E2723"/>
  <rect x="120" y="260" width="20" height="20" rx="10" fill="none" stroke="#C89F65" stroke-width="3"/>
</svg>
