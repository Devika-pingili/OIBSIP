<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Convert temperatures between Celsius, Fahrenheit, and Kelvin quickly and accurately.">
    <title>Temperature Converter</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main container -->
    <div class="container">

        <!-- Card layout -->
        <main class="card">

            <!-- Header section -->
            <header class="card-header">
                <h1>Temperature Converter</h1>
                <p class="subtitle">Convert temperatures quickly and accurately between Celsius, Fahrenheit, and Kelvin.</p>
            </header>

            <!-- Converter form section -->
            <section class="converter-section" aria-labelledby="converter-heading">
                <h2 id="converter-heading" class="visually-hidden">Temperature Conversion Form</h2>

                <!-- Error message area -->
                <div id="error-message" class="error-message" role="alert" aria-live="polite"></div>

                <!-- Input group -->
                <div class="input-group">
                    <label for="temperature-input">Temperature</label>
                    <input
                        type="text"
                        id="temperature-input"
                        name="temperature"
                        placeholder="Enter Temperature"
                        inputmode="decimal"
                        autocomplete="off"
                    >
                </div>

                <!-- Unit selector dropdown -->
                <div class="input-group">
                    <label for="unit-select">Input Unit</label>
                    <select id="unit-select" name="unit">
                        <option value="celsius">Celsius (°C)</option>
                        <option value="fahrenheit">Fahrenheit (°F)</option>
                        <option value="kelvin">Kelvin (K)</option>
                    </select>
                </div>

                <!-- Convert button -->
                <button type="button" id="convert-btn" class="convert-btn">
                    Convert Temperature
                </button>
            </section>

            <!-- Result section -->
            <section class="result-section" id="result-section" aria-labelledby="result-heading" hidden>
                <h2 id="result-heading">Converted Results</h2>
                <p class="input-display" id="input-display"></p>

                <div class="result-list">
                    <div class="result-item">
                        <span class="result-label">Celsius:</span>
                        <span class="result-value" id="result-celsius">--</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">Fahrenheit:</span>
                        <span class="result-value" id="result-fahrenheit">--</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">Kelvin:</span>
                        <span class="result-value" id="result-kelvin">--</span>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>
</body>
</html>
